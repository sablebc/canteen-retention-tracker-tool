server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The tracker export is uploaded through here. nginx defaults to 1 MB,
    # well under the backend's own 25 MB ceiling, and would reject the file
    # with a 413 before Django ever saw it.
    client_max_body_size 32m;

    # Docker's embedded DNS. Resolving the backend per request rather than once
    # at startup means this container still starts when the backend is not up
    # yet, and follows it to a new address when it is recreated - nginx
    # otherwise refuses to start at all with "host not found in upstream".
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend http://backend:8001;

    # Everything Django owns, proxied from inside this container rather than
    # routed by whatever sits in front. That is what keeps the app on a single
    # origin: the browser only ever talks to this server, so its requests are
    # same-origin and CORS is never consulted. It also means a reverse proxy in
    # front needs one ordinary entry pointing here, with no custom locations.
    location ~ ^/(api|admin|static)/ {
        proxy_pass $backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A tracker import re-runs the whole ingest over ~3000 rows inside the
        # request, which takes appreciably longer than the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed asset filenames change whenever their contents do, so they are
    # safe to cache indefinitely. index.html deliberately is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every unmatched path falls back to index.html so a
    # reload on a client-side route serves the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
